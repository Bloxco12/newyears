<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>New Year Countdown</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: radial-gradient(circle at bottom, #020617, #000);
    font-family: "Inter", system-ui, sans-serif;
    color: white;
    overflow: hidden;
  }

  /* 🌌 Starfield */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(1px 1px at 20% 30%, #fff, transparent),
      radial-gradient(1px 1px at 80% 40%, #fff, transparent),
      radial-gradient(1px 1px at 50% 80%, #fff, transparent),
      radial-gradient(1px 1px at 70% 20%, #fff, transparent);
    opacity: .4;
    animation: stars 60s linear infinite;
  }

  @keyframes stars {
    from { transform: translateY(0); }
    to { transform: translateY(-2000px); }
  }

  canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
  }

  .container {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(12px);
  }

  h1 {
    font-size: clamp(2.5rem, 5vw, 4rem);
    margin-bottom: 40px;
    text-shadow: 0 0 20px #38bdf8;
  }

  /* 🔮 Countdown */
  .countdown {
    display: flex;
    gap: clamp(15px, 3vw, 30px);
  }

  .unit {
    text-align: center;
  }

  .flip {
    width: clamp(90px, 12vw, 140px);
    height: clamp(120px, 16vw, 180px);
    perspective: 1200px;
  }

  .card {
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(145deg, #020617, #020617cc);
    border: 1px solid #38bdf855;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(3rem, 6vw, 5rem);
    font-weight: 800;
    color: #e0f2fe;
    box-shadow:
      0 0 30px #38bdf855,
      inset 0 0 30px #0ea5e955;
    backface-visibility: hidden;
  }

  .top { transform-origin: bottom; }
  .bottom {
    transform: rotateX(180deg);
    transform-origin: top;
  }

  .flip.animate .top {
    animation: flipTop .8s cubic-bezier(.4,0,.2,1);
  }

  .flip.animate .bottom {
    animation: flipBottom .8s cubic-bezier(.4,0,.2,1);
  }

  @keyframes flipTop {
    0% { transform: rotateX(0); }
    100% { transform: rotateX(-90deg); }
  }

  @keyframes flipBottom {
    0% { transform: rotateX(90deg); }
    100% { transform: rotateX(0); }
  }

  .label {
    margin-top: 15px;
    font-size: .9rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: .7;
  }
</style>
</head>
<body>

<canvas id="fx"></canvas>

<div class="container">
  <h1>✨ New Year Countdown ✨</h1>

  <div class="countdown">
    <div class="unit"><div class="flip" id="days"></div><div class="label">Days</div></div>
    <div class="unit"><div class="flip" id="hours"></div><div class="label">Hours</div></div>
    <div class="unit"><div class="flip" id="minutes"></div><div class="label">Minutes</div></div>
    <div class="unit"><div class="flip" id="seconds"></div><div class="label">Seconds</div></div>
  </div>
</div>

<script>
  const ids = ["days","hours","minutes","seconds"];
  const last = {};

  function render(el, v) {
    el.innerHTML = `
      <div class="card top">${v}</div>
      <div class="card bottom">${v}</div>
    `;
  }

  function flip(el, v) {
    if (last[el.id] === v) return;
    last[el.id] = v;
    el.classList.remove("animate");
    render(el, v);
    void el.offsetWidth;
    el.classList.add("animate");
  }

  ids.forEach(id => render(document.getElementById(id), "--"));

  function tick() {
    const now = new Date();
    const target = new Date(now.getFullYear() + 1, 0, 1);
    const d = target - now;

    if (d <= 0) return startFireworks();

    flip(days, Math.floor(d / 86400000));
    flip(hours, Math.floor(d / 3600000) % 24);
    flip(minutes, Math.floor(d / 60000) % 60);
    flip(seconds, Math.floor(d / 1000) % 60);
  }

  setInterval(tick, 1000);
  tick();

  /* 🎆 Fireworks */
  const c = fx, ctx = c.getContext("2d");
  resize(); addEventListener("resize", resize);
  let p = [];

  function resize() {
    c.width = innerWidth;
    c.height = innerHeight;
  }

  function boom(x,y) {
    for (let i=0;i<120;i++) {
      p.push({
        x,y,
        vx:(Math.random()-.5)*10,
        vy:(Math.random()-.5)*10,
        life:120,
        h:Math.random()*360
      });
    }
  }

  function startFireworks() {
    setInterval(() => boom(Math.random()*c.width, Math.random()*c.height*.6), 500);
  }

  function animate() {
    ctx.fillStyle = "rgba(0,0,0,.15)";
    ctx.fillRect(0,0,c.width,c.height);

    p.forEach((o,i)=>{
      o.x+=o.vx; o.y+=o.vy; o.life--;
      ctx.fillStyle = `hsla(${o.h},100%,60%,${o.life/120})`;
      ctx.shadowBlur = 20;
      ctx.shadowColor = ctx.fillStyle;
      ctx.fillRect(o.x,o.y,3,3);
      if(o.life<=0) p.splice(i,1);
    });

    requestAnimationFrame(animate);
  }
  animate();
</script>

</body>
</html>
